<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="400" r="220" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="90" height="90" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 32 25 C 22 25 18 32 18 40 L 18 45 C 18 50 14 52 8 52 C 14 52 18 54 18 59 L 18 64 C 18 72 22 79 32 79" 
          fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 58 25 C 68 25 72 32 72 40 L 72 45 C 72 50 76 52 82 52 C 76 52 72 54 72 59 L 72 64 C 72 72 68 79 58 79" 
          fill="none" stroke="url(#textGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="36" cy="52" r="3" fill="#38bdf8"/>
    <circle cx="45" cy="52" r="3" fill="#818cf8"/>
    <circle cx="54" cy="52" r="3" fill="#c084fc"/>
  </g>

  <!-- Brand Title & Tagline -->
  <text x="215" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#38bdf8">DEVELOPER TOOL SUITE</text>
  <text x="215" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff">JSON Studio</text>

  <!-- Big Headline -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#f8fafc">
    The Modern <tspan fill="url(#textGrad)">JSON Powerhouse</tspan>
  </text>
  
  <text x="100" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Viewer • Diff Comparer • Schema Validator • JSONPath • Auto-Repair • Converters
  </text>

  <!-- Feature Badges -->
  <g transform="translate(100, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="50" rx="12" fill="url(#pillGrad)" stroke="#334155"/>
    <text x="90" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Ultra Fast</text>

    <!-- Badge 2 -->
    <rect x="195" y="0" width="220" height="50" rx="12" fill="url(#pillGrad)" stroke="#334155"/>
    <text x="305" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#818cf8" text-anchor="middle">🔒 100% Client-Side</text>

    <!-- Badge 3 -->
    <rect x="430" y="0" width="210" height="50" rx="12" fill="url(#pillGrad)" stroke="#334155"/>
    <text x="535" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle">✨ Auto-Repair</text>

    <!-- Badge 4 -->
    <rect x="655" y="0" width="240" height="50" rx="12" fill="url(#pillGrad)" stroke="#334155"/>
    <text x="775" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#f472b6" text-anchor="middle">🛠️ TS / YAML / CSV / XML</text>
  </g>

  <!-- Footer Domain Brand -->
  <rect x="100" y="520" width="1000" height="1" fill="#334155" opacity="0.6"/>
  <text x="100" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#64748b">jsonstudio-app.web.app</text>
  <text x="1100" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#64748b" text-anchor="end">Free &amp; Open Web Developer Tool</text>
</svg>
