<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.15"/>

  <!-- Left Bracket { -->
  <path d="M 190 120 C 145 120 135 150 135 190 L 135 220 C 135 242 120 256 95 256 C 120 256 135 270 135 292 L 135 322 C 135 362 145 392 190 392" 
        fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Bracket } -->
  <path d="M 322 120 C 367 120 377 150 377 190 L 377 220 C 377 242 392 256 417 256 C 392 256 377 270 377 292 L 377 322 C 377 362 367 392 322 392" 
        fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Central Code Nodes / Dots -->
  <circle cx="216" cy="256" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="14" fill="#818cf8"/>
  <circle cx="296" cy="256" r="14" fill="#c084fc"/>
</svg>
